[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "stac-catalog-service"
version = "0.1.0"
description = "Metadata ingestion and STAC catalog search service"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<1",
    "fastapi>=0.141,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pystac>=1.15,<2",
    "pyproj>=3.8.0,<4",
    "shapely>=2.1,<3",
    "uvicorn[standard]>=0.53,<1",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1,<27",
    "httpx>=0.28,<1",
    "mypy>=2.3.1,<3",
    "pylint>=4.0.8,<5",
    "pytest>=9,<10",
    "taskipy>=1.14.1,<2",
    "types-defusedxml>=0.7.0,<1",
    "types-shapely>=2.1,<3",
]

[tool.taskipy.tasks]
typecheck = "python -m mypy ."
lint = "python -m pylint app"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ['\\.venv']

[tool.pylint.main]
py-version = "3.12"
disable = ["missing-module-docstring", "missing-function-docstring", "missing-class-docstring"]

[tool.pylint.format]
max-line-length = 88